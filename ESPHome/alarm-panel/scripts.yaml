script:
  - id: script_page_carousel
    mode: restart
    then:
        - lvgl.page.show: pageA 
        - delay: 30s    #wait for sensors etc to be ready 
        - while:
            condition:
                - wifi.connected:
            then:
                - lvgl.page.show: pageA 
                - delay: 5 min              
                - while:
                    condition:
                        - text_sensor.state:
                            id: homeassistant_alarm
                            state: 'disarmed'                        
                    then:
                        - lvgl.page.show: pageB
                        - delay: 10s
                        - lvgl.page.show: pageC
                        - delay: 1s
                        - lvgl.page.show: pageD
                        - delay: 8s      
        - lvgl.page.show: pageA           
