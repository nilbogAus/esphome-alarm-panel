script:
  - id: script_page_carousel
    mode: restart
    then:
        - delay: 15s    #wait for sensors etc to be ready 
        - while:
            condition:
                - wifi.connected:
            then:
                - delay: 5 min              
                - while:
                    condition:
                        - text_sensor.state:
                            id: homeassistant_alarm
                            state: 'disarmed'                        
                    then:
                        - lvgl.page.show: page_help
                        - if:
                            condition:
                                lambda: 'return id(uptime_sensor).state < 1;'
                            then:
                                - delay: 8s   
                        - if:
                            condition:
                                lambda: 'return id(uptime_sensor).state < 3;'
                            then:
                                - delay: 4s   
                        - if:
                            condition:
                                lambda: 'return id(uptime_sensor).state < 7;'
                            then:
                                - delay: 3s  
                        - delay: 3s  
                        - lvgl.page.show: pageB
                        - delay: 8s
                        - lvgl.page.show: pageC
                        - delay: 2s
                        - globals.set:
                            id: g_ForcastDay
                            value: '0'
                        - script.execute: script_pageD_weather
                        - delay: 8s  
                        - globals.set:
                            id: g_ForcastDay
                            value: '1'
                        - script.execute: script_pageD_weather
                        - delay: 4s                          
        - lvgl.page.show: pageA           
