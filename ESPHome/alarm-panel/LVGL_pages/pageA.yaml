# Alarm Page
http_request:
  useragent: esphome/device
  timeout: 10s
  watchdog_timeout: 15s

image:
  - platform: online_image
    url: "http://video-1.local:8081/"
    format: JPEG
    type: RGB565
    id: cam_1_image
    resize: 320x480

interval:
  - interval: 30s              
    then:
      - component.update: cam_1_image
      - lvgl.image.update:
          id: cam1_stream_widget

