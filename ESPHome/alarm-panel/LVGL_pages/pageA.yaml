- id: pageA
  bg_color: col_black
  widgets:
    - label:
        id: lbl_title_pgA
        text_color: col_yellow
        text_font: roboto_lrg
        text: "Alarm"
        align: TOP_MID
    - label:
        id: img_alarm_icon        
        text_color: col_white
        text_font: icons_200
        text: "\U000F02D6"
        align: TOP_MID        
        align_to: 
          id: lbl_tittle
          align: OUT_BOTTOM_MID
    - label:
        id: lbl_status
        text_color: col_gray
        text_font: roboto_lrg
        text: "Loading..."
        align: TOP_MID    
        align_to: 
          id: img_alarm_icon
          align: OUT_BOTTOM_MID         
    - textarea:
        id: txt_passcode
        one_line: true       
        placeholder_text: "Enter code"   
        width: 50%
        align_to:         
          id: lbl_status
          align: OUT_BOTTOM_MID         

