#electricity Page

lvgl:
  pages:
    - id: pageB
      bg_color: col_black
      widgets:
        - label:
            id: lbl_tittle
            text_color: col_yellow
            text_font: roboto_lrg
            text: "Electricity"
            align: TOP_MID
    
        - meter:
            id: meter_power
            width: 270
            height: 270
            border_side: none        
            align_to: 
              id: lbl_tittle
              align: OUT_BOTTOM_MID
            bg_color: 0x000050   
            bg_grad_color: 0x0000BB
            bg_grad_dir: ver 
            text_color: col_white
            text_font: roboto_sml
            scales:
              range_from: -9000
              range_to: 9000
              angle_range: 270
              ticks:
                count: 19
                length: 16
                major:
                  stride: 3
                  length: 13
                  label_gap: 13
                  width: 1
                  color: col_white
              indicators:
                - line:
                    id: power_needle
                    width: 4
                    color: col_white
                - arc:
                    color: col_red
                    start_value: -9000
                    end_value: 0    
                    width: 8   
                - arc:
                    color: col_yellow
                    start_value: 0
                    end_value: 450                           
                    width: 8   
                - arc:
                    color: col_dkgreen
                    start_value: 450
                    end_value: 9000                  
                    width: 8   
    
        - label:
            id: cost_wh
            recolor: true
            width: 100%
            text_font: roboto
            text_align: CENTER
            text: "Loading"
            bg_color: 0x0000BB
            bg_grad_color: 0x0000FF
            align_to: 
              id: meter_power
              align: BOTTOM_MID       
                

        - bar:
            id: bar_battery
            width: 90%
            height: 35
            min_value: 1
            max_value: 100
            border_width: 1
            border_color: col_white
            pad_all: 10
            align_to: 
              id: cost_wh
              align: OUT_BOTTOM_MID   
              y: 15 
        - label:
            id: lbl_battery
            width: 90%
            text_font: roboto
            text_color: col_white
            text_align: CENTER
            text: "Loading"
            align_to: 
              id: bar_battery
              align: CENTER       

    
        - textarea:
            id: textarea_poweredby
            cursor:
              bg_opa: transp   
            width: 95%     
            border_side: none
            bg_color: 0x010101   
            bg_grad_color: 0x444444
            bg_grad_dir: ver         
            one_line: false
            align_to: 
              id: bar_battery
              align: OUT_BOTTOM_MID   

        - meter:
            height: 145
            width: 145
            border_width: 0
            bg_opa: TRANSP
            align_to: 
              id: bar_battery
              align: OUT_BOTTOM_LEFT 
              y: 15
            scales:
              - range_from: -5
                range_to: 5
                angle_range: 180 # sets the total angle to 180 = starts mid left and ends mid right
                ticks:
                  count: 11
                indicators:
                  - line:
                      id: battery_needle
                      width: 2
                      color: col_gray
                      value: 0

        - meter:
            height: 145
            width: 145
            border_width: 0
            bg_opa: TRANSP
            align_to: 
              id: bar_battery
              align: OUT_BOTTOM_RIGHT
              y: 15
            scales:
              - range_from: 0
                range_to: 12
                angle_range: 180 # sets the total angle to 180 = starts mid left and ends mid right
                ticks:
                  count: 13
                indicators:
                  - line:
                      id: solar_needle
                      width: 2
                      color: col_gray
                      value: 0
      
