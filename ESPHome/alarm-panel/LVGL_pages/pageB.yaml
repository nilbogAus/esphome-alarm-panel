#electricity Page

lvgl:
  pages:
    - id: pageB
      bg_color: col_black
      widgets:
        - label:
            id: lbl_tittle
            text_color: col_yellow
            text_font: roboto_lrg
            text: "Electricity"
            align: TOP_MID
    
        - meter:
            id: meter_power
            width: 270
            height: 270
            border_side: none        
            align_to: 
              id: lbl_tittle
              align: OUT_BOTTOM_MID
            bg_color: 0x000050   
            bg_grad_color: 0x0000BB
            bg_grad_dir: ver 
            text_color: col_white
            text_font: roboto_sml
            scales:
              range_from: -9000
              range_to: 9000
              angle_range: 270
              ticks:
                count: 19
                length: 16
                major:
                  stride: 3
                  length: 13
                  label_gap: 13
                  width: 1
                  color: col_white
              indicators:
                - line:
                    id: power_needle
                    width: 4
                    color: col_white
                - arc:
                    color: col_red
                    start_value: -9000
                    end_value: 0    
                    width: 8   
                - arc:
                    color: col_yellow
                    start_value: 0
                    end_value: 450                           
                    width: 8   
                - arc:
                    color: col_dkgreen
                    start_value: 450
                    end_value: 9000                  
                    width: 8   
    
        - label:
            id: cost_wh
            recolor: true
            width: 100%
            text_font: roboto
            text_align: CENTER
            text: "Loading"
            bg_color: 0x0000BB
            bg_grad_color: 0x0000FF
            align_to: 
              id: meter_power
              align: BOTTOM_MID       

        - obj:
              id: battery_symbol_obj
              align_to: 
                id: cost_wh
                align: OUT_BOTTOM_MID    
              width: 60
              height: 24
              bg_color: 0
              pad_all: 0
              outline_width: 0
              outline_color: 0
              border_width: 0
              border_color: 0
              border_side: NONE
              outline_pad: 0
              radius: 0
  #            hidden: ${Hide_Battery_Symbol}
              hidden: false
              widgets:
                - line:
                    id: battery_symbol
                    points:
                      - 12, 2
                      - 18, 2
                      - 17, 2
                      - 17, 4
                      - 17, 3
                      - 20, 3
                      - 19, 3
                      - 19, 20
                      - 19, 19
                      - 10, 19
                      - 11, 19
                      - 11, 2
                      - 11, 3
                      - 14, 3
                    line_width: 2
                    line_rounded: false
                    #line_color: 
                - bar:
                    id: battery_bar
                    x: 12
                    y: 3
                    height: 15
                    width: 6
                    radius: 0
                    min_value: 0
                    max_value: 100
                    bg_color: 0
                    indicator:
                      # bg_color:  !lambda |-
                      #   if( id(battery_soc_value) <= id(min_soc_value) ) {
                      #     return lv_color_hex(0xff0000); // red
                      #     } else {
                      #     return lv_color_hex(0x00ff00); // green
                      #   }
                      radius: 0
                    value: 0
                - label:
                    id: battery_label
                    x: 25
                    y: 3
                    text_font: MONTSERRAT_14
                    text_align: CENTER
                    width: 35
                    # text_color: !lambda |-
                    #   if( id(battery_soc_value) <= id(min_soc_value) ) {
                    #     return lv_color_hex(0xff0000); // red
                    #     } else {
                    #     return lv_color_hex(0x00ff00); // green
                    #   }
                    # text: !lambda |-
                    #   return (to_string(static_cast<int>(id(battery_soc_value)))+"%").c_str();

      
    
        - textarea:
            id: textarea_poweredby
            text_color: col_green
            text_font: roboto_sml
            cursor:
              bg_opa: transp        
            border_side: none
            bg_color: 0x010101   
            bg_grad_color: 0x444444
            bg_grad_dir: ver         
            one_line: false
            placeholder_text: "Powered by"
            align_to: 
              id: battery_symbol_obj
              align: OUT_BOTTOM_MID    
    
      
