#Weather Page


lvgl:
  pages:
    - id: pageD
      widgets:
        - obj: # a properly placed coontainer object for all these controls
            bg_color: col_black
            radius: 0
            width: 100%
            height: 100%
            scrollbar_mode: "OFF"
            pad_all: 0
            border_width: 0
            widgets:  
                - obj:
                    pad_all: 0
                    id: wg_Temperatures
                    bg_color: 0x000000   
                    width: 100%
                    align: TOP_MID
                    height: SIZE_CONTENT
                    border_width: 0    
                    scrollbar_mode: "OFF"
                    widgets:
                        # Temperature
                        - obj:
                            pad_all: 1
                            width: 50%
                            height: SIZE_CONTENT
                            id: wg_Temperatures_Inside
                            align_to:         
                                id: wg_Temperatures
                                align: TOP_LEFT 
                            border_color: col_black
                            bg_color: 0x000000   
                            bg_grad_color: 0x0000BB
                            bg_grad_dir: ver        
                            scrollbar_mode: "OFF"         
                            widgets:
                                - label:
                                    id: wg_Temperatures_Inside_Title
                                    align_to:         
                                        id: wg_Temperatures_Inside
                                        align: TOP_MID                                  
                                    text: ${inside_temp_Name}
                                    text_color: col_blue
                                - label:
                                    id: lbl_inside_temp
                                    pad_right: 6
                                    scrollbar_mode: "OFF"
                                    align_to:         
                                        id: wg_Temperatures_Inside_Title
                                        align: OUT_BOTTOM_MID                                  
                                    text: "??.?°C"
                                    text_color: col_white
                                    border_width: 0
                                    radius: 10         
                                    text_font: roboto_lrg
                                    text_align: CENTER      
                        - obj:
                            pad_all: 1
                            width: 50%
                            height: SIZE_CONTENT
                            id: wg_Temperatures_Outside
                            align_to:         
                                id: wg_Temperatures
                                align: TOP_RIGHT 
                            border_color: col_black
                            bg_color: 0x000000   
                            bg_grad_color: 0x0000BB
                            bg_grad_dir: ver    
                            scrollbar_mode: "OFF"                
                            widgets:                                  
                                - label:
                                    id: wg_Temperatures_Outside_Title
                                    align_to:         
                                        id: wg_Temperatures_Outside
                                        align: TOP_MID                     
                                    text: ${outside_temp_Name}
                                    text_color: col_blue
                                - label:
                                    id: lbl_outside_temp
                                    pad_right: 6
                                    scrollbar_mode: "OFF"
                                    align_to:         
                                        id: wg_Temperatures_Outside_Title
                                        align: OUT_BOTTOM_MID                               
                                    text: "??.?°C"
                                    text_color: col_white
                                    border_width: 0
                                    radius: 10          
                                    text_font: roboto_lrg
                                    text_align: CENTER  
                                    
                - obj:
                    id: wg_Weather
                    bg_color: col_black
                    height: SIZE_CONTENT
                    width: 100%
                    align_to:         
                        id: wg_Temperatures
                        align: OUT_BOTTOM_MID   
                    border_width: 0
                    pad_all: 0
                    scrollbar_mode: "OFF"   
                    bg_grad_color: 0x983500
                    bg_grad_dir: ver
                    widgets:
                        - obj:
                            #extra temps
                            pad_all: 1
                            width: 30%
                            height: SIZE_CONTENT
                            id: wg_Extra_temps_Right
                            align_to:         
                                id: wg_Weather
                                align: TOP_RIGHT
                            border_color: col_black
                            bg_color: 0x000000   
                            bg_grad_color: 0x0000BB
                            bg_grad_dir: ver    
                            scrollbar_mode: "OFF" 
                            hidden: true     
                            widgets:                                  
                                - label:
                                    id: wg_Extra_temps_Right_Title
                                    align_to:         
                                        id: wg_Extra_temps_Right
                                        align: TOP_MID                     
                                    text: ${extra_temp_right_name}
                                    text_color: col_blue        
                                - label:
                                    id: lbl_Extra_temps_Right
                                    pad_right: 6
                                    scrollbar_mode: "OFF"
                                    align_to:         
                                        id: wg_Extra_temps_Right_Title
                                        align: OUT_BOTTOM_MID                               
                                    text: "??.?°C"
                                    text_color: col_white
                                    border_width: 0
                                    radius: 10          
                                    text_font: roboto
                                    text_align: CENTER    
                        - obj:
                            #extra temps
                            pad_all: 1
                            width: 30%
                            height: SIZE_CONTENT
                            id: wg_Extra_temps_Left
                            align_to:         
                                id: wg_Weather
                                align: TOP_LEFT
                            border_color: col_black
                            bg_color: 0x000000   
                            bg_grad_color: 0x0000BB
                            bg_grad_dir: ver    
                            scrollbar_mode: "OFF" 
                            hidden: true     
                            widgets:                                  
                                - label:
                                    id: wg_Extra_temps_Left_Title
                                    align_to:         
                                        id: wg_Extra_temps_Left
                                        align: TOP_MID                     
                                    text: ${extra_temp_left_name}
                                    text_color: col_blue        
                                - label:
                                    id: lbl_Extra_temps_Left
                                    pad_right: 6
                                    scrollbar_mode: "OFF"
                                    align_to:         
                                        id: wg_Extra_temps_Left_Title
                                        align: OUT_BOTTOM_MID                               
                                    text: "??.?°C"
                                    text_color: col_white
                                    border_width: 0
                                    radius: 10          
                                    text_font: roboto
                                    text_align: CENTER           

                        # Forcast Icon
                        - label:
                            id: lbl_weather_day_today
                            text: "Today"
                            pad_all: 5 
                            border_width: 0
                            text_color: col_blue
                            text_align: CENTER     
                            align_to:         
                                id: wg_Weather
                                align: TOP_MID   
                        - label:
                            id: lbl_weather_day_tomorrow
                            text: "Tomorrow"
                            hidden: true
                            pad_all: 5 
                            border_width: 0
                            text_color: col_blue
                            text_align: CENTER     
                            align_to:         
                                id: wg_Weather
                                align: TOP_MID         
                        - label:
                            id: lbl_weather_day_monday
                            text: "Monday"
                            hidden: true
                            pad_all: 5 
                            border_width: 0
                            text_color: col_blue
                            text_align: CENTER     
                            align_to:         
                                id: wg_Weather
                                align: TOP_MID     
                        - label:
                            id: lbl_weather_day_tuesday
                            text: "Tuesday"
                            hidden: true
                            pad_all: 5 
                            border_width: 0
                            text_color: col_blue
                            text_align: CENTER     
                            align_to:         
                                id: wg_Weather
                                align: TOP_MID                                                                                               
                        - label:
                            id: lbl_weather_day_wednesday
                            text: "Wednesday"
                            hidden: true
                            pad_all: 5 
                            border_width: 0
                            text_color: col_blue
                            text_align: CENTER     
                            align_to:         
                                id: wg_Weather
                                align: TOP_MID                                                                                               
                        - label:
                            id: lbl_weather_day_thursday
                            text: "Thursday"
                            hidden: true
                            pad_all: 5 
                            border_width: 0
                            text_color: col_blue
                            text_align: CENTER     
                            align_to:         
                                id: wg_Weather
                                align: TOP_MID                                                                                               
                        - label:
                            id: lbl_weather_day_friday
                            text: "Friday"
                            hidden: true
                            pad_all: 5 
                            border_width: 0
                            text_color: col_blue
                            text_align: CENTER     
                            align_to:         
                                id: wg_Weather
                                align: TOP_MID                                                                                               
                        - label:
                            id: lbl_weather_day_saturday
                            text: "Saturday"
                            hidden: true
                            pad_all: 5 
                            border_width: 0
                            text_color: col_blue
                            text_align: CENTER     
                            align_to:         
                                id: wg_Weather
                                align: TOP_MID                                                                                               
                        - label:
                            id: lbl_weather_day_sunday
                            text: "Sunday"
                            hidden: true
                            pad_all: 5 
                            border_width: 0
                            text_color: col_blue
                            text_align: CENTER     
                            align_to:         
                                id: wg_Weather
                                align: TOP_MID                                                                                               
                                                                                            
                        - label:
                            id: lbl_weather_icon
                            text_font: icons_200
                            text: "\U000F02D6"
                            text_color: col_white
                            border_width: 0
                            border_color: col_green
                            bg_grad_color: col_green
                            bg_grad_dir: ver                        
                            text_align: CENTER   
                            height: SIZE_CONTENT
                            pad_all: 0   
                            align_to:         
                                id: lbl_weather_day_today
                                align: OUT_BOTTOM_MID 
                        - obj:
                            id: wg_weather_text
                            bg_color: col_black
                            height: SIZE_CONTENT
                            width: 100%
                            align_to:         
                                id: lbl_weather_icon
                                align: OUT_BOTTOM_MID   
                            text_color: col_white
                            text_align: CENTER
                            text_font: roboto_sml
                            border_width: 0
                            pad_all: 0
                            widgets:                
                                - label:
                                    id: lbl_weather_text_temp
                                    text: "Loading\n..."
                                    width: 50%
                                    pad_all: 2
                                    align_to:         
                                        id: wg_weather_text
                                        align: LEFT_MID
                                - label:
                                    id: lbl_weather_text_rain
                                    text: "Loading\n..."
                                    width: 50%
                                    pad_all: 2
                                    align_to:         
                                        id: wg_weather_text
                                        align: RIGHT_MID                               
                        - label:
                            id: lbl_weather_longtext
                            text: "What’s the worst type of weather to hire?\nLightning, it’s always on strike.\nWhat did one raindrop say to the other?\nTwo’s company, three’s a cloud!"
                            text_color: col_green
                            pad_all: 5 
                            border_width: 0
                            text_font: roboto_sml
                            text_align: CENTER  
                            height: 100
                            scrollbar_mode: "OFF"
                            width: 100%
                            align_to:         
                                id: wg_weather_text
                                align: OUT_BOTTOM_MID   
                - obj:
                    id: wg_rain
                    bg_color: 0x005555
                    height: SIZE_CONTENT
                    width: 100%
                    align: BOTTOM_MID
                    pad_all: 4
                    border_width: 0
                    widgets:
                        - label:
                            id: lbl_rain
                            text: "Loading"
                            border_width: 0
                            width: 100%
                            text_color: col_white
                            text_align: CENTER     
                            align_to:         
                                id: wg_rain
                                align: BOTTOM_MID  
                              
