script:
  - id: weather_icon_update
    parameters: 
        icon: string
    then:
      - lambda: |-
          ESP_LOGD("lambda", "Weather icon update called with parameter: %s", icon.c_str());
      - lvgl.label.update:
          id: lbl_weather_icon
          text: !lambda |-
            std::hash<std::string> hasher;

            switch (hasher(icon.c_str()))
            {
                case 1242744452: // mdi:weather-pouring
                    return ("\U000F0596");// pouring
                    break;
                case 3309699129: // mdi:weather-cloudy
                    return ("\U000F0590");// cloudy
                    break;                
                case 2949318122: // mdi:weather-night
                    return ("\U000F0594");// clear-night
                    break;
                case 345913139: // mdi:weather-hurricane
                    return ("\U000F0898"); //weather-hurricane
                    break;     
                case 1492665726: // mdi:weather-hazy
                    return ("\U000F0F30"); //weather-hazy
                    break;
                case 3041611428: // mdi:weather-sunny
                    return ("\U000F0599");// sunny
                    break;     
                case 2562052155: // mdi:weather-partly-rainy
                case 3241844169: // mdi:weather-light-showers              
                    return ("\U000F0F33");//
                    break;
                case 3348912596: // mdi:weather-partly-cloudy
                    return ("\U000F0595"); // partlycloudy
                    break;
                case 3416433233: // mdi:weather-rainy
                    return ("\U000F0597"); // rainy
                    break; 
                case 2453884742: // mdi:weather-windy          
                    return ("\U000F059D"); // windy
                    break;
                case 3996108531: // mdi:weather-snowy
                    return ("\U000F0598"); // snowy
                    break;
                case 344035588: // mdi:weather-lightning-rainy
                    return ("\U000F067E"); // lightning-rainy
                    break;                 
                case 3167514251: // mdi:weather-fog
                    return ("\U000F0591"); // fog
                    break;
                case 1097013394: // mdi:snowflake-melt
                    return ("\U000F12CB"); // snowflake-melt
                    break;  
                default:
                    ESP_LOGD("lambda", "Unknown weather type: string %s hash %u",id(forecast_icon_today).state.c_str(), hasher(id(forecast_icon_today).state));
                    return ("\U000F0F2F");
            }             
  
  - id: script_hide_weather_labels
    then:
      - lvgl.label.update:
          id: lbl_weather_day_today
          hidden: true
      - lvgl.label.update:
          id: lbl_weather_day_tomorrow
          hidden: true
      - lvgl.label.update:
          id: lbl_weather_day_monday
          hidden: true
      - lvgl.label.update:
          id: lbl_weather_day_tuesday
          hidden: true
      - lvgl.label.update:
          id: lbl_weather_day_wednesday
          hidden: true
      - lvgl.label.update:
          id: lbl_weather_day_thursday
          hidden: true
      - lvgl.label.update:
          id: lbl_weather_day_friday
          hidden: true
      - lvgl.label.update:
          id: lbl_weather_day_saturday
          hidden: true
      - lvgl.label.update:
          id: lbl_weather_day_sunday
          hidden: true

  - id: script_pageD_weather
    then:
      - lambda: |-
          ESP_LOGI("pageD", "Running script_pageD_weather, The weather integer value is: %d", id(g_ForcastDay));    
      # display todays weather
      - if:
          condition:
            lambda: 'return id(g_ForcastDay) == 0;'
          then:
            - script.execute:
                id: script_hide_weather_labels          
            - lvgl.label.update:
                id: lbl_weather_day_today
                hidden: false
            - script.execute:
                id: weather_icon_update
                icon: !lambda |-
                  return id(forecast_icon_today).state; 
            - lvgl.label.update:
                id: lbl_weather_longtext
                text: !lambda "return (id(forecast_text_today).state);" 
            - lvgl.label.update:
                id: lbl_rain
                text:
                  format: "%s%s chance of rain"
                  args: [ 'id(forecast_rain_chance_today).state.c_str()', '"%"' ]        
            - lvgl.label.update:
                id: lbl_weather_text_rain
                text:
                  format: "%.0f to %.0fmm"
                  args: [ 'id(forecast_rain_amount_min_today).state','id(forecast_rain_amount_max_today).state' ]                            
            - lvgl.label.update:
                id: lbl_weather_text_temp
                text:
                  format: "%s %.0f°C"
                  args: [ 'id(forecast_label_today).state.c_str()','id(forecast_temp_today).state' ]      


      # display tomorrows weather
      - if:
          condition:
            lambda: 'return id(g_ForcastDay) == 1;'
          then:
            - script.execute:
                id: script_hide_weather_labels             
            - lvgl.label.update:
                id: lbl_weather_day_tomorrow
                hidden: false                                                          
            - script.execute:
                id: weather_icon_update
                icon: !lambda |-
                  return id(forecast_icon_tomorrow).state;
            - lvgl.label.update:
                id: lbl_weather_longtext
                text: !lambda "return (id(forecast_text_tomorrow).state);" 
            - lvgl.label.update:
                id: lbl_rain
                text:
                  format: "%s%s chance of rain"
                  args: [ 'id(forecast_rain_chance_tomorrow).state.c_str()', '"%"' ]     
            - lvgl.label.update:
                id: lbl_weather_text_rain
                text:
                  format: "%.0f to %.0fmm"
                  args: [ 'id(forecast_rain_amount_min_tomorrow).state','id(forecast_rain_amount_max_tomorrow).state' ]
            - lvgl.label.update:
                id: lbl_weather_text_temp
                text:
                  format: "%.0f to %.0f°C"
                  args: [ 'id(forecast_temp_tomorrow_min).state','id(forecast_temp_tomorrow_max).state' ]

      # today +2  weather
      - if:
          condition:
            lambda: 'return id(g_ForcastDay) == 2;'
          then:
            - script.execute:
                id: script_hide_weather_labels 
            - script.execute:
                id: weather_label_show
            - script.execute:
                id: weather_icon_update
                icon: !lambda |-
                  return id(forecast_icon_2).state;
            - lvgl.label.update:
                id: lbl_weather_longtext
                text: !lambda "return (id(forecast_text_2).state);" 
            - lvgl.label.update:
                id: lbl_rain
                text:
                  format: "%s%s chance of rain"
                  args: [ 'id(forecast_rain_chance_2).state.c_str()', '"%"' ]     
            - lvgl.label.update:
                id: lbl_weather_text_rain
                text:
                  format: "%.0f to %.0fmm"
                  args: [ 'id(forecast_rain_amount_min_2).state','id(forecast_rain_amount_max_2).state' ]
            - lvgl.label.update:
                id: lbl_weather_text_temp
                text:
                  format: "%.0f to %.0f°C"
                  args: [ 'id(forecast_temp_2_min).state','id(forecast_temp_2_max).state' ]


      - lvgl.page.show: pageD


  - id: weather_label_show
    then:
      - if:
          condition:
            lambda: 'return (id(homeassistant_time).now().day_of_week + id(g_ForcastDay) == 3);'
          then:
            - lvgl.label.update:
                id: lbl_weather_day_monday
                hidden: false  
      - if:
          condition:
            lambda: 'return (id(homeassistant_time).now().day_of_week + id(g_ForcastDay) == 4);'
          then:
            - lvgl.label.update:
                id: lbl_weather_day_tuesday
                hidden: false  
      - if:
          condition:
            lambda: 'return (id(homeassistant_time).now().day_of_week + id(g_ForcastDay) == 5);'
          then:
            - lvgl.label.update:
                id: lbl_weather_day_wednesday
                hidden: false  
      - if:
          condition:
            lambda: 'return (id(homeassistant_time).now().day_of_week + id(g_ForcastDay) == 5);'
          then:
            - lvgl.label.update:
                id: lbl_weather_day_thursday
                hidden: false  
      - if:
          condition:
            lambda: 'return (id(homeassistant_time).now().day_of_week + id(g_ForcastDay) == 6);'
          then:
            - lvgl.label.update:
                id: lbl_weather_day_friday
                hidden: false  
      - if:
          condition:
            lambda: 'return (id(homeassistant_time).now().day_of_week + id(g_ForcastDay) == 7);'
          then:
            - lvgl.label.update:
                id: lbl_weather_day_saturday
                hidden: false    
      - if:
          condition:
            lambda: 'return (id(homeassistant_time).now().day_of_week + id(g_ForcastDay) == 8);'
          then:
            - lvgl.label.update:
                id: lbl_weather_day_sunday
                hidden: false    
      - if:
          condition:
            lambda: 'return (id(homeassistant_time).now().day_of_week + id(g_ForcastDay) == 9);'
          then:
            - lvgl.label.update:
                id: lbl_weather_day_monday
                hidden: false                
      - if:
          condition:
            lambda: 'return (id(homeassistant_time).now().day_of_week + id(g_ForcastDay) == 10);'
          then:
            - lvgl.label.update:
                id: lbl_weather_day_tuesday
                hidden: false    



