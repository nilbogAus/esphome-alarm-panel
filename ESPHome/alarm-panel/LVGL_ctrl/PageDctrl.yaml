#Weather Page
time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: "Australia/Sydney"
    # Overrides the default 15 minutes.
    update_interval: 24h 

globals:
  - id: g_ForcastDay
    type: int
    restore_value: no
    initial_value: '0'

binary_sensor:
  - platform: matrix_keypad
    keypad_id: keypad
    id: keypadD
    key: D
    on_press:
      # manage day counter for forcast pages
      then:
      - if:
          condition:
            - lvgl.page.is_showing: pageD
          then:
            - lambda: |-
                id(g_ForcastDay)++;
            - if:
                condition:
                  lambda: return(id(g_ForcastDay) > 2);   # max number of forcast pages
                then:
                  - globals.set:
                      id: g_ForcastDay
                      value: '0'   
          else:
            - globals.set:
                id: g_ForcastDay
                value: '0'            
 
      - script.execute: script_pageD_weather
      - script.execute: script_page_carousel

sensor:
  # Temperature
  - platform: homeassistant
    name: "Inside Temp"
    id: inside_temp
    entity_id: sensor.${inside_temp}
    on_value:
      - lvgl.label.update:
          id: lbl_inside_temp
          text: 
            format: "%.1f°C"
            args: ['id(inside_temp).get_state()']
  - platform: homeassistant
    name: "Outside Temp"
    id: outside_temp
    entity_id: sensor.${outside_temp}
    on_value:
      - lvgl.label.update:
          id: lbl_outside_temp
          text: 
            format: "%.1f°C"
            args: ['id(outside_temp).get_state()']    
  - platform: homeassistant
    name: "Right Extra Temp"
    id: Extra_temp_right
    entity_id: sensor.${extra_temp_right}
    on_value:
      - lvgl.label.update:
          id: lbl_Extra_temps_Right
          text: 
            format: "%.1f°C"
            args: ['id(Extra_temp_right).get_state()']   
      - lvgl.widget.show: wg_Extra_temps_Right
  - platform: homeassistant
    name: "Left Extra Temp"
    id: Extra_temp_left
    entity_id: sensor.${extra_temp_left}
    on_value:
      - lvgl.label.update:
          id: lbl_Extra_temps_Left
          text: 
            format: "%.1f°C"
            args: ['id(Extra_temp_left).get_state()']   
      - lvgl.widget.show: wg_Extra_temps_Left

