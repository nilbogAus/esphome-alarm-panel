#electricity Page

globals:
  - id: g_powerprice
    type: float
    restore_value: no
    initial_value: '0.3628'
  - id: g_solarprice
    type: float
    restore_value: no
    initial_value: '0.04'    

sensor:
  - platform: homeassistant
    name: "Net Power state"
    id: net_power
    entity_id: sensor.net_power
    on_value:       
      then:
        - lvgl.indicator.update:
            id: power_needle
            value: !lambda "return x;"
        - if:
            condition:
              lambda: "return (x > 450); "
            then:
              - lvgl.label.update:
                  id: cost_wh
                  bg_color: 0x55FF55
                  bg_grad_color: 0x00EE00
                  text: 
                    format: "#000000 %.0fW, earning %.0f¢/ph"
                    args: [ 'id(net_power).get_state()',  'id(net_power).get_state()*id(g_solarprice)/10']
            else:
              - if:
                  condition:
                    lambda: "return (x > 0); "
                  then:
                    - lvgl.label.update:
                        id: cost_wh
                        bg_color: 0xFFFF55
                        bg_grad_color: 0xEEEE00                        
                        text: 
                          format: "#000000 %.0fW, earning %.0f¢/ph"
                          args: [ 'id(net_power).get_state()',  'id(net_power).get_state()*id(g_solarprice)/10'] 
                  else:           
                    - lvgl.label.update:
                        id: cost_wh
                        bg_color: 0xFF5555
                        bg_grad_color: 0xEE0000
                        text: 
                          format: "#000000 %.0fW, costing $%.2fph"
                          args: [ 'id(net_power).get_state()',  'id(net_power).get_state()*id(g_powerprice)/-1000']    

  #small meters                          
  - platform: homeassistant
    name: "Home Battery Power"
    id: home_battery_power
    entity_id: sensor.encharge_492334007623_power    
    on_value:       
      then:
        - lvgl.indicator.update:
            id: battery_needle
            value: !lambda "return (-x);"    
  - platform: homeassistant
    name: "Home Solar Power"
    id: home_solar_power
    entity_id: sensor.envoy_122348003312_current_power_production    
    on_value:       
      then:
        - lvgl.indicator.update:
            id: solar_needle
            value: !lambda "return (x*1000);"               
            
       
  - platform: homeassistant
    name: "Home Battery Percent"
    id: home_battery_percent
    entity_id: sensor.encharge_492334007623_battery
    on_value:
      - lvgl.bar.update:
          id: bar_battery
          value: !lambda "return x;"
      - lvgl.label.update:
          id: lbl_battery
          text: 
            format: "Battery %.0f%%"
            args: ['x']
      - if:
          condition:
            lambda: "return (x < 15); "
          then:
            - lvgl.bar.update:
                id: bar_battery
                bg_color: col_red
                indicator:
                  bg_color: col_red     
          else:
            - if:
                condition:
                  lambda: "return (x < 50); "
                then:          
                  - lvgl.bar.update:
                      id: bar_battery
                      bg_color: col_yellow
                      indicator:
                        bg_color: col_yellow          
                else:          
                  - lvgl.bar.update:
                      id: bar_battery
                      bg_color: col_green
                      indicator:
                        bg_color: col_green           



