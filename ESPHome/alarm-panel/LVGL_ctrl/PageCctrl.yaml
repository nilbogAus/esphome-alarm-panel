          args: [ 'id(blind_tane).state' ]  

cover:
  - platform: template
    name: "Template Cover Study"
    id: cover_study
    lambda: |-
      if (isnan(id(blind_study).state)) {
        switch (id(g_blinds_study)) {
          case 50:
            return COVER_OPEN;
            break;
          case 0:
            return COVER_CLOSED;
          default:
            if (id(sun).state == "below_horizon") {
              return COVER_CLOSED;
            } else {
              return COVER_OPEN;
            };
            break; 
        }
      } else {
        if (id(blind_study).state < 90 && id(blind_study).state > 10) {
          return COVER_OPEN;
        } else {
          return COVER_CLOSED;
        };      
      };
    open_action:
      - homeassistant.service:
          service: cover.open_cover
          data_template:
            entity_id: cover.study  
      - globals.set:
          id: g_blinds_study
          value: '50'
    close_action:
      - homeassistant.service:
          service: cover.close_cover
          data_template:
            entity_id: cover.study  
      - globals.set:
          id: g_blinds_study
          value: 0
    optimistic: true

text_sensor:
  - platform: homeassistant
    entity_id: sun.sun
    id: sun
    on_value:
      - globals.set:
          id: g_blinds_study
          value: 999

globals:
  - id: g_blinds_study
    type: integer
    restore_value: no
    initial_value: 999
  - id: blinds_lucy_open
    type: bool
    restore_value: no
    initial_value: 'true'    
  - id: blinds_tane_open
    type: bool
    restore_value: no
    initial_value: 'true'     

