globals:
  - id: blinds_study_open
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: blinds_lucy_open
    type: bool
    restore_value: no
    initial_value: 'true'    
  - id: blinds_tane_open
    type: bool
    restore_value: no
    initial_value: 'true'     

binary_sensor: 
  - platform: matrix_keypad
    keypad_id: keypad
    id: keypad1
    key: 1
    on_press:
      - if:
          condition:
            lvgl.page.is_showing: pageC
          then:
            switch.toggle: tanes_lights
  - platform: matrix_keypad
    keypad_id: keypad
    id: keypad2
    key: 2
    on_press:
      - if:
          condition:
            lvgl.page.is_showing: pageC
          then:
            switch.toggle: front_lights
  - platform: matrix_keypad
    keypad_id: keypad
    id: keypad3
    key: 3
    on_press:
      - if:
          condition:
            lvgl.page.is_showing: pageC
          then:
            switch.toggle: kitchen_lights
  - platform: matrix_keypad
    keypad_id: keypad
    id: keypad4
    key: 4
    on_press:
      - if:
          condition:
            lvgl.page.is_showing: pageC
          then:
            - if:
                condition:
                  lambda: 'return id(blinds_tane_open) == false;'
                then:
                  - homeassistant.service:
                      service: cover.open_cover
                      data_template:
                        entity_id: cover.tane  
                  - globals.set:
                      id: blinds_tane_open
                      value: 'true'  
                  - lvgl.widget.update:
                      id: lvgl_keypad_button4
                      state: 
                        checked: false                           
                else:
                  - homeassistant.service:
                      service: cover.close_cover
                      data_template:
                        entity_id: cover.tane  
                  - globals.set:
                      id: blinds_tane_open
                      value: 'false'   
                  - lvgl.widget.update:
                      id: lvgl_keypad_button4
                      state: 
                        checked: true       

  - platform: matrix_keypad
    keypad_id: keypad
    id: keypad5
    key: 5
    on_press:
      - if:
          condition:
            lvgl.page.is_showing: pageC
          then:
            - if:
                condition:
                  lambda: 'return id(blinds_lucy_open) == false;'
                then:               
                  - homeassistant.service:
                      service: cover.open_cover
                      data_template:
                        entity_id: cover.carrington_rd  
                  - homeassistant.service:
                      service: cover.open_cover
                      data_template:
                        entity_id: cover.darri_ave                          
                  - globals.set:
                      id: blinds_lucy_open
                      value: 'true'  
                  - lvgl.widget.update:
                      id: lvgl_keypad_button5
                      state: 
                        checked: false                           
                else:
                  - homeassistant.service:
                      service: cover.close_cover
                      data_template:
                        entity_id: cover.carrington_rd  
                  - homeassistant.service:
                      service: cover.close_cover
                      data_template:
                        entity_id: cover.darri_ave                          
                  - globals.set:
                      id: blinds_lucy_open
                      value: 'false'   
                  - lvgl.widget.update:
                      id: lvgl_keypad_button5
                      state: 
                        checked: true   
  - platform: matrix_keypad
    keypad_id: keypad
    id: keypad6
    key: 6
    on_press:
      - if:
          condition:
            lvgl.page.is_showing: pageC
          then:
            - if:
                condition:
                  lambda: 'return id(blinds_study_open) == false;'
                then:
                  - homeassistant.service:
                      service: cover.open_cover
                      data_template:
                        entity_id: cover.study  
                  - globals.set:
                      id: blinds_study_open
                      value: 'true'  
                  - lvgl.widget.update:
                      id: lvgl_keypad_button6
                      state: 
                        checked: false                           
                else:
                  - homeassistant.service:
                      service: cover.close_cover
                      data_template:
                        entity_id: cover.study  
                  - globals.set:
                      id: blinds_study_open
                      value: 'false'   
                  - lvgl.widget.update:
                      id: lvgl_keypad_button6
                      state: 
                        checked: true    
  - platform: matrix_keypad
    keypad_id: keypad
    id: keypad7
    key: 7
    on_press:
      - if:
          condition:
            lvgl.page.is_showing: pageC
          then:
            switch.toggle: kids_ac             
  - platform: matrix_keypad
    keypad_id: keypad
    id: keypad8
    key: 8
    on_press:
      - if:
          condition:
            lvgl.page.is_showing: pageC
          then:
            switch.toggle: master_ac
  - platform: matrix_keypad
    keypad_id: keypad
    id: keypad_star
    key: "*"
    on_press:
      - if:
          condition:
            lvgl.page.is_showing: pageC
          then:
            switch.toggle: lvgl_keypad_button_star