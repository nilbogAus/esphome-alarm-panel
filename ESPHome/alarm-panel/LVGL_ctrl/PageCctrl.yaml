sensor:
  - platform: homeassistant
    entity_id: cover.study     
    attribute: current_tilt_position
    id: blind_study  
  - platform: homeassistant
    entity_id: cover.carrington_rd     
    attribute: current_tilt_position
    id: blind_lucy1  
  - platform: homeassistant
    entity_id: cover.darri_ave     
    attribute: current_tilt_position
    id: blind_lucy2  
  - platform: homeassistant
    entity_id: cover.tane     
    attribute: current_tilt_position
    id: blind_tane  


script:
  - id: script_pageC_blinds
    mode: restart
    then:
      - logger.log: "blind sensor monitor start"
      - delay: 30s    #wait for sensors etc to be ready
      - while:
          condition:
              - wifi.connected:
          then:
            - if:
                condition:
                  sensor.in_range:
                    id: blind_tane
                    above: 10.0
                    below: 90.0
                then:
                  globals.set:
                    id: blinds_tane_open
                    value: 'true' 
                else:                
                  globals.set:
                    id: blinds_tane_open
                    value: 'false' 
            - if:
                condition:
                  sensor.in_range:
                    id: blind_study
                    above: 10.0
                    below: 90.0
                then:
                  globals.set:
                    id: blinds_study_open
                    value: 'true' 
                else:                
                  globals.set:
                    id: blinds_study_open
                    value: 'false'    
            - if:
                condition:
                  or:
                    - sensor.in_range:
                        id: blind_lucy1
                        above: 10.0
                        below: 90.0
                    - sensor.in_range:
                        id: blind_lucy1
                        above: 10.0
                        below: 90.0
                then:
                  globals.set:
                    id: blinds_tane_open
                    value: 'true' 
                else:                
                  globals.set:
                    id: blinds_tane_open
                    value: 'false'      
            - logger.log:
                format: "The blind study reports value %.1f "
                args: [ 'id(blind_study).state' ]   
            - logger.log:
                format: "The blind_lucy1 reports value %.1f "
                args: [ 'id(blind_lucy1).state' ]   
            - logger.log:
                format: "The blind_lucy2 reports value %.1f "
                args: [ 'id(blind_lucy2).state' ]   
            - logger.log:
                format: "The blind_tane reports value %.1f "
                args: [ 'id(blind_tane).state' ]          
            - delay: 10min

globals:
  - id: blinds_study_open
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: blinds_lucy_open
    type: bool
    restore_value: no
    initial_value: 'true'    
  - id: blinds_tane_open
    type: bool
    restore_value: no
    initial_value: 'true'     

binary_sensor: 
  - platform: matrix_keypad
    keypad_id: keypad
    id: keypad1
    key: 1
    on_press:
      - if:
          condition:
            lvgl.page.is_showing: pageC
          then:
            switch.toggle: tanes_lights
  - platform: matrix_keypad
    keypad_id: keypad
    id: keypad2
    key: 2
    on_press:
      - if:
          condition:
            lvgl.page.is_showing: pageC
          then:
            switch.toggle: front_lights
  - platform: matrix_keypad
    keypad_id: keypad
    id: keypad3
    key: 3
    on_press:
      - if:
          condition:
            lvgl.page.is_showing: pageC
          then:
            switch.toggle: kitchen_lights
  - platform: matrix_keypad
    keypad_id: keypad
    id: keypad4
    key: 4
    on_press:
      - if:
          condition:
            lvgl.page.is_showing: pageC
          then:
            - if:
                condition:
                  lambda: 'return id(blinds_tane_open) == false;'
                then:
                  - homeassistant.service:
                      service: cover.open_cover
                      data_template:
                        entity_id: cover.tane  
                  - globals.set:
                      id: blinds_tane_open
                      value: 'true'  
                  - lvgl.widget.update:
                      id: lvgl_keypad_button4
                      state: 
                        checked: false                           
                else:
                  - homeassistant.service:
                      service: cover.close_cover
                      data_template:
                        entity_id: cover.tane  
                  - globals.set:
                      id: blinds_tane_open
                      value: 'false'   
                  - lvgl.widget.update:
                      id: lvgl_keypad_button4
                      state: 
                        checked: true       

  - platform: matrix_keypad
