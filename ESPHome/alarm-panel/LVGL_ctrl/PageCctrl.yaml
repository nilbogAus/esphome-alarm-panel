      - logger.log:
          format: "The blind_lucy1 reports value %.1f to sensor"
          args: [ 'id(blind_lucy1).state' ]  
  - platform: homeassistant
    entity_id: cover.darri_ave     
    attribute: current_tilt_position
    id: blind_lucy2  
