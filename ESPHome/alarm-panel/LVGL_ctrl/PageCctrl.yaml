                        entity_id: cover.carrington_rd  
                  - homeassistant.service:
                      service: cover.close_cover
                      data_template:
                        entity_id: cover.darri_ave                          
                  - globals.set:
                      id: blinds_lucy_open
                      value: 'false'   
                  - lvgl.widget.update:
                      id: lvgl_keypad_button5
                      state: 
                        checked: true   
  - platform: matrix_keypad
    keypad_id: keypad
    id: keypad6
