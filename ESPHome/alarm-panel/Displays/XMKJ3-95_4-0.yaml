# Brand: XMKJ
# Model: 3.95/4.0
# URL: https://www.aliexpress.com/item/1005005791515997.html

display:
  - platform: mipi_spi # ili9xxx
    model: ILI9488 #ST7796
    id: my_display
    invert_colors: false    
    spi_id: display_spi
    dc_pin: GPIO27
    reset_pin: GPIO33
    cs_pin: 
      number: GPIO15
      ignore_strapping_warning: true 
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: true
#    dimensions:  #320x480 only possible with psram
#      width: 320
#      height: 480
#    rotation: 0
#    #color_palette: NONE 
    data_rate: 40MHz
#    auto_clear_enabled: false
#    update_interval: never
    # pages: !include_dir_merge_list alarm-panel/display_pages/