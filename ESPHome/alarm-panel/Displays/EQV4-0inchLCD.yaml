# Brand: EQV
# Model: 4.0 inch LCD
# URL: https://www.aliexpress.com/item/1005009660112822

display:
  - platform: mipi_spi # ili9xxx
    model: ILI9488 #ST7796
    id: my_display
    invert_colors: false    
    spi_id: display_spi
    dc_pin: GPIO27
    reset_pin: GPIO33
    cs_pin: 
      number: GPIO15
      ignore_strapping_warning: true 
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false
#    dimensions:  #320x480 only possible with psram
#      width: 320
#      height: 480
#    rotation: 0
#    #color_palette: NONE 
    data_rate: 40MHz
#    auto_clear_enabled: false
#    update_interval: never
    # pages: !include_dir_merge_list alarm-panel/display_pages/